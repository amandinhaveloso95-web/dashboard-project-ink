<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner view: clothing brand operations (fictional data)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0A0A0A;--paper:#F5F5F3;--card:#fff;--g1:#3a3a38;--g2:#6b6b67;--g3:#b9b9b4;--g4:#e6e6e1;--g5:#efefeb}
html,body{height:100%;background:#dcdcd7;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--paper);transform-origin:0 0;display:grid;grid-template-columns:264px 1fr;grid-template-rows:1fr 34px}
.num{font-variant-numeric:tabular-nums}
/* nav */
#nav{background:var(--ink);color:var(--paper);padding:22px 16px 12px;display:flex;flex-direction:column;gap:9px}
#nav .brand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#a9a9a4}
#nav h1{font-size:23px;line-height:1.05;letter-spacing:-.02em;margin:5px 0 12px;font-weight:700}
#nav h1 span{font-weight:300}
.nv{border:1px solid #3a3a38;padding:11px 13px;cursor:pointer;transition:background .15s;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:end}
.nv:hover{background:#1c1c1b}
.nv.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.nv .q{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a9a9a4;grid-column:1/3}
.nv.on .q{color:var(--g2)}
.nv .t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.nv .k{font-size:25px;font-weight:700;letter-spacing:-.04em;line-height:1}
.nv .s{font-size:12px;color:#a9a9a4;grid-column:1/3}
.nv.on .s{color:var(--g2)}
#nav .how{margin-top:auto;font-size:12px;line-height:1.4;color:#a9a9a4;border-top:1px solid #3a3a38;padding-top:9px}
/* main */
#main{padding:18px 24px 10px;display:flex;flex-direction:column;min-height:0}
#top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px}
#top .kick{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--g2)}
#top h2{font-size:33px;letter-spacing:-.035em;line-height:1.05;font-weight:700;margin-top:3px}
.slc{display:flex;gap:16px;align-items:flex-end}
.sl label{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--g2);margin-bottom:4px}
.chips{display:flex}
.chip{font-size:12px;padding:6px 10px;border:1px solid var(--ink);margin-left:-1px;cursor:pointer;background:var(--card);user-select:none;white-space:nowrap}
.chip:first-child{margin-left:0}
.chip.on{background:var(--ink);color:var(--paper)}
.chip:hover:not(.on){background:var(--g5)}
#page{flex:1;min-height:0;display:grid;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--g3);padding:13px 15px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.card h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}
.card h3 em{font-style:normal;font-weight:400;color:var(--g2);letter-spacing:.04em;text-transform:none;font-size:12px}
.kp{display:grid;gap:12px}
.kpi{background:var(--card);border:1px solid var(--g3);padding:12px 15px;cursor:default;position:relative}
.kpi.go{cursor:pointer}.kpi.go:hover{border-color:var(--ink)}
.kpi .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--g2)}
.kpi .v{font-size:38px;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:3px}
.kpi .d{font-size:12px;color:var(--g1);margin-top:2px}
.kpi.alert{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kpi.alert .l,.kpi.alert .d{color:#c9c9c4}
.kpi .ar{position:absolute;right:12px;top:10px;font-size:12px;color:var(--g2)}
/* rows / bars */
.rows{display:flex;flex-direction:column;flex:1;min-height:0;justify-content:space-between}
.r{display:grid;align-items:center;gap:10px;font-size:13px;padding:3px 4px;cursor:pointer;border-left:3px solid transparent}
.r:hover{background:var(--g5)}
.r.sel{border-left-color:var(--ink);background:var(--g5);font-weight:700}
.r.dim{opacity:.32}
.tr{height:15px;background:var(--g5);position:relative}
.b{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.b.g{background:var(--g3)}
.b.st{background:repeating-linear-gradient(135deg,var(--ink) 0 4px,#fff 4px 8px);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.rt{text-align:right}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--g2);font-weight:700;padding:5px 7px;border-bottom:1.5px solid var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--ink)}
td{padding:5px 7px;border-bottom:1px solid var(--g4);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--g5)}
tbody tr.sel{background:var(--ink);color:var(--paper)}
tbody tr.sel .tr{background:#3a3a38}tbody tr.sel .b{background:var(--paper)}
tbody tr.sel .b.st{background:repeating-linear-gradient(135deg,var(--paper) 0 4px,#0a0a0a 4px 8px);outline-color:var(--paper)}
.tw{overflow:auto;flex:1;min-height:0}
.tag{display:inline-block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor}
.tag.k{background:var(--ink);color:var(--paper);border-color:var(--ink)}
tbody tr.sel .tag.k{background:var(--paper);color:var(--ink)}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:1}
.st1{border:1px solid var(--g3);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.st1:hover{border-color:var(--ink)}.st1.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.st1.dim{opacity:.35}
.st1 .n{font-size:44px;font-weight:700;letter-spacing:-.05em;line-height:1}
.st1 .t{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.st1 .x{font-size:12px;color:var(--g2)}.st1.sel .x{color:#c9c9c4}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-height:0}
.cm{border:1px solid var(--g3);padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.cm.empty{border-style:dashed;align-items:center;justify-content:center;color:var(--g2);font-size:12.5px;text-align:center}
.cm b.nm{font-size:16px;letter-spacing:-.02em}
.cm .ln{display:flex;justify-content:space-between;font-size:12.5px;border-bottom:1px solid var(--g4);padding:3px 0}
.cm .ln i{font-style:normal;color:var(--g2)}
.cm .ln .best{background:var(--ink);color:var(--paper);padding:0 6px}
.note{font-size:12px;color:var(--g2);line-height:1.4;margin-top:7px}
.todo{display:flex;flex-direction:column;gap:6px;flex:1;justify-content:space-between}
.td1{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:13px;border-bottom:1px solid var(--g4);padding-bottom:6px;cursor:pointer}
.td1:hover b{text-decoration:underline}
.td1 .i{width:22px;height:22px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.td1 span{color:var(--g2);font-size:12px}
svg text{font-family:inherit}
#foot{grid-column:1/3;background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px}
#foot b{font-weight:700;letter-spacing:.02em}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;display:none;z-index:9;max-width:260px;line-height:1.35}
[data-a]:focus-visible{outline:2px solid #0a0a0a;outline-offset:2px}#nav [data-a]:focus-visible{outline-color:#f5f5f3}</style>
</head>
<body>
<div id="stage">
  <aside id="nav"></aside>
  <main id="main">
    <div id="top"></div>
    <div id="page"></div>
  </main>
  <div id="foot"><span><b>Fictional data.</b> I can't share company data. The structure shows the work I did at Project Ink Media: the questions, the indicators and who decided what.</span><span><b>Amanda Moraes</b></span></div>
</div>
<div id="tip"></div>
<script>
/* ---------- fictional data, fixed seed ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261118);
const LINES=['Tees','Hoodies','Caps','Jackets','Tour merch','Accessories'];
const MONTHS=['Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'];
const BASE=[26000,20000,9000,12000,16000,6000],MARG=[.42,.36,.44,.24,.31,.38],SEAS=[1.12,1.2,.78,.74,.86,.95,1.02,1.1,1.16,1.04,.92,1.0];
const SALES=MONTHS.map((m,i)=>LINES.map((l,j)=>{const rev=Math.round(BASE[j]*SEAS[i]*(.9+R()*.2)/100)*100;const mg=MARG[j]+(R()-.5)*.06;return{rev,cost:Math.round(rev*(1-mg))}}));
const STAGES=['Briefing','Design','Revisions','Production','Delivered'];
const DES=['Avery K.','Jordan M.','Riley S.','Casey T.','Morgan L.','Quinn B.','Devon R.','Harper J.','Rowan P.','Skyler N.','Emery D.','Blake W.'];
const LOAD=[80,130,95,45,115,70,30,90,100,60,105,85];
const SUP=[
{n:'Ridgeway Print Co.',t:'Screen print',price:5.2,prom:10,real:11,ont:91,def:1.2,ord:34},
{n:'Calloway Screen Works',t:'Screen print',price:4.4,prom:9,real:14,ont:68,def:3.9,ord:12},
{n:'Bluefin Textiles',t:'Fabric',price:7.8,prom:21,real:22,ont:88,def:0.9,ord:27},
{n:'Maple & Loom',t:'Fabric',price:6.9,prom:18,real:25,ont:61,def:2.4,ord:9},
{n:'Northgate Embroidery',t:'Embroidery',price:9.6,prom:12,real:12,ont:95,def:0.6,ord:22},
{n:'Stitchline Studio',t:'Embroidery',price:8.1,prom:10,real:15,ont:72,def:4.8,ord:7},
{n:'Harlan Labels & Tags',t:'Labels & print',price:1.1,prom:7,real:8,ont:90,def:1.5,ord:31},
{n:'Pressroom 22',t:'Labels & print',price:0.9,prom:7,real:12,ont:66,def:5.6,ord:11}];
const TYPES=[...new Set(SUP.map(s=>s.t))];
const PROJ=[
['Summer drop tee',0,0,3,0,18000,16200,1800,0],['Tour hoodie v2',4,1,2,6,24000,26900,1200,2],['Dad cap restock',2,2,4,0,6000,5400,900,4],
['Varsity jacket',3,1,3,9,32000,35800,400,3],['Album launch tee',4,4,1,0,15000,4200,2000,0],['Heavyweight hoodie',1,5,3,0,21000,19800,800,2],
['Logo beanie',5,6,0,0,5000,600,700,4],['Festival capsule',4,7,2,4,28000,24100,1600,1],['Embroidered crewneck',1,8,3,12,19000,21400,650,5],
['Tote bag run',5,9,4,0,4000,3700,1000,6],['Coach jacket',3,10,1,0,26000,7300,350,2],['Vintage wash tee',0,11,2,0,14000,9800,1500,0],
['Trucker cap collab',2,3,1,0,8000,2100,800,4],['Zip hoodie',1,4,4,0,17000,16100,600,2],['Sticker & patch pack',5,6,3,3,3000,3300,2000,7],
['Long sleeve tee',0,0,4,0,12000,11500,1100,0],['Arena tour tee',4,1,3,5,22000,23600,1900,1],['Bomber jacket',3,8,0,0,30000,1200,300,3],
['Snapback run',2,2,2,0,7000,4900,750,5],['Sock bundle',5,9,1,0,4500,900,1200,6]
].map((p,i)=>({id:i,n:p[0],line:p[1],des:p[2],stage:p[3],late:p[4],bud:p[5],spent:p[6],units:p[7],sup:p[8]}));
const STOCK=[
['Blank tee, M','Material',0,420,600],['Blank tee, L','Material',0,980,600],['Blank hoodie, M','Material',1,150,300],['Blank hoodie, L','Material',1,310,300],
['Cap blanks','Material',2,260,400],['Jacket shells','Material',3,90,80],['Woven labels','Material',5,5200,3000],['Hang tags','Material',5,4100,3000],
['Poly mailers','Material',5,800,1500],['Screen ink, black (L)','Material',0,14,10],['Embroidery thread (cones)','Material',2,22,30],
['Summer drop tee','Finished',0,640,200],['Zip hoodie','Finished',1,120,150],['Dad cap','Finished',2,510,200],['Tote bag','Finished',5,770,200],
['Long sleeve tee','Finished',0,180,250],['Tour hoodie v1','Finished',4,60,100],['Festival tee, last season','Finished',4,940,150]
].map(s=>({n:s[0],t:s[1],line:s[2],q:s[3],min:s[4]}));
const DEF=MONTHS.map(()=>SUP.map(s=>Math.max(0,+(s.def*(.6+R()*.8)).toFixed(1))));
/* ---------- state ---------- */
const S={page:0,line:null,period:12,stage:null,des:null,stype:null,cmp:[],sort:{},psel:null};
const $=q=>document.querySelector(q);
const usd=v=>v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+(v/1e3).toFixed(v>=1e5?0:1)+'K':'$'+Math.round(v);
const pct=v=>v.toFixed(1)+'%';
const inLine=j=>S.line===null||S.line===j;
const mIdx=()=>MONTHS.map((m,i)=>i).slice(12-S.period);
const mSum=(i,f)=>LINES.reduce((a,l,j)=>a+(inLine(j)?SALES[i][j][f]:0),0);
const projs=()=>PROJ.filter(p=>inLine(p.line));
const active=()=>projs().filter(p=>p.stage<4);
const lowStock=()=>STOCK.filter(s=>inLine(s.line)&&s.q<s.min);
const nav=[
{t:'Overview',q:'How is the business today?',k:()=>usd(mSum(11,'rev')),s:()=>'sales in '+MONTHS[11]},
{t:'Projects & team',q:'What is moving, who has room?',k:()=>active().filter(p=>p.late>0).length,s:()=>'late of '+active().length+' active projects'},
{t:'Suppliers',q:'Which supplier for this job?',k:()=>SUP.filter(s=>s.ont<75).length,s:()=>'of '+SUP.length+' suppliers below 75% on time'},
{t:'Cost & margin',q:'Is each project making money?',k:()=>projs().filter(p=>p.spent>p.bud).length,s:()=>'projects over budget'},
{t:'Stock & quality',q:'What is stuck, what went wrong?',k:()=>lowStock().length,s:()=>'items below minimum stock'}];
/* ---------- helpers ---------- */
function bars(items,o={}){const max=o.max||Math.max(...items.map(i=>i.v),1);return '<div class="rows">'+items.map(i=>`<div class="r ${i.sel?'sel':''} ${i.dim?'dim':''}" style="grid-template-columns:${o.lw||120}px 1fr ${o.vw||64}px" data-a="${o.a||''}" data-v="${i.key??''}" data-tip="${i.tip||''}"><span>${i.l}</span><div class="tr"><div class="b ${i.cls||''}" style="width:${Math.min(100,i.v/max*100)}%"></div>${i.mark!=null?`<div class="mk" style="left:${Math.min(100,i.mark/max*100)}%"></div>`:''}</div><span class="rt num">${i.t}</span></div>`).join('')+'</div>'}
function cols(vals,line,labels,fmtA,fmtB){const W=760,H=250,pl=44,pb=22,pt=14,n=vals.length,max=Math.max(...vals)*1.12,bw=(W-pl-10)/n;const y=v=>pt+(H-pt-pb)*(1-v/max);const lmax=Math.max(...line)+6,lmin=Math.min(...line)-6;const ly=v=>pt+(H-pt-pb)*(1-(v-lmin)/(lmax-lmin));
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;flex:1;min-height:0">`;
[0,.5,1].forEach(f=>{const v=max*f/1.12;s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e6e1"/><text x="${pl-6}" y="${y(v)+4}" font-size="12" text-anchor="end" fill="#6b6b67">${usd(v)}</text>`});
vals.forEach((v,i)=>{const x=pl+i*bw+bw*.16;s+=`<rect x="${x}" y="${y(v)}" width="${bw*.68}" height="${H-pb-y(v)}" fill="${i===n-1?'#0A0A0A':'#b9b9b4'}" data-tip="${labels[i]}: ${fmtA(v)} sales, ${fmtB(line[i])} margin"/><text x="${x+bw*.34}" y="${H-6}" font-size="12" text-anchor="middle" fill="#3a3a38">${labels[i]}</text>`});
s+=`<polyline fill="none" stroke="#0A0A0A" stroke-width="2" points="${line.map((v,i)=>(pl+i*bw+bw*.5)+','+ly(v)).join(' ')}"/>`;
line.forEach((v,i)=>{s+=`<circle cx="${pl+i*bw+bw*.5}" cy="${ly(v)}" r="3.5" fill="#fff" stroke="#0A0A0A" stroke-width="2"/>`});
s+=`<text x="${pl+(n-1)*bw+bw*.5}" y="${ly(line[n-1])-9}" font-size="12" font-weight="700" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">${fmtB(line[n-1])}</text>`;
return s+'</svg>'}
function tbl(id,cols,rows,o={}){const st=S.sort[id];if(st){rows=[...rows].sort((a,b)=>{const x=a._[st.c],y=b._[st.c];return(x<y?-1:x>y?1:0)*(st.d?1:-1)})}
return `<div class="tw"><table><thead><tr>${cols.map((c,i)=>`<th data-a="sort" data-v="${id}|${i}">${c}${st&&st.c===i?(st.d?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.sel?'sel':''}" data-a="${o.a||''}" data-v="${r.key}">${r.c.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const mini=(v,max,cls)=>`<div class="tr" style="width:90px;display:inline-block;vertical-align:middle"><div class="b ${cls||''}" style="width:${Math.min(100,v/max*100)}%"></div></div>`;
const kpi=(l,v,d,o={})=>`<div class="kpi ${o.alert?'alert':''} ${o.go!=null?'go':''}" ${o.go!=null?`data-a="page" data-v="${o.go}"`:''}><div class="l">${l}</div><div class="v num">${v}</div><div class="d">${d}</div>${o.go!=null?'<div class="ar">open →</div>':''}</div>`;
/* ---------- pages ---------- */
const P=[];
P[0]=()=>{const ix=mIdx(),rev=ix.map(i=>mSum(i,'rev')),mg=ix.map(i=>{const r=mSum(i,'rev');return r?(1-mSum(i,'cost')/r)*100:0});
const cur=mSum(11,'rev'),prev=mSum(10,'rev'),mc=(1-mSum(11,'cost')/cur)*100,mp=(1-mSum(10,'cost')/prev)*100;
const late=active().filter(p=>p.late>0),over=projs().filter(p=>p.spent>p.bud),low=lowStock();
const byLine=LINES.map((l,j)=>({l,key:j,v:ix.reduce((a,i)=>a+SALES[i][j].rev,0),sel:S.line===j,dim:S.line!==null&&S.line!==j})).map(x=>({...x,t:usd(x.v),tip:'Click to filter every page by '+x.l}));
const worst=[...SUP].sort((a,b)=>a.ont-b.ont)[0],lp=[...late].sort((a,b)=>b.late-a.late)[0],op=[...over].sort((a,b)=>(b.spent/b.bud)-(a.spent/a.bud))[0],ls=[...low].sort((a,b)=>a.q/a.min-b.q/b.min)[0];
const todo=[];if(lp)todo.push([1,`<b>${lp.n}</b> is ${lp.late} days late`,STAGES[lp.stage]+', '+DES[lp.des]]);if(op)todo.push([3,`<b>${op.n}</b> is ${Math.round((op.spent/op.bud-1)*100)}% over budget`,usd(op.spent)+' of '+usd(op.bud)]);if(ls)todo.push([4,`<b>${ls.n}</b> is at ${Math.round(ls.q/ls.min*100)}% of minimum stock`,ls.q.toLocaleString()+' of '+ls.min.toLocaleString()]);todo.push([2,`<b>${worst.n}</b> delivers on time ${worst.ont}% of the time`,worst.t+', '+worst.ord+' orders']);
return{grid:'grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr 1fr',html:
`<div class="kp" style="grid-column:1/3;grid-template-columns:repeat(5,1fr)">${kpi('Sales, '+MONTHS[11],usd(cur),(cur>=prev?'+':'')+pct((cur/prev-1)*100)+' vs '+MONTHS[10])}${kpi('Gross margin',pct(mc),(mc>=mp?'+':'')+(mc-mp).toFixed(1)+' pts vs '+MONTHS[10],{go:3})}${kpi('Active projects',active().length,projs().filter(p=>p.stage===3).length+' in production',{go:1})}${kpi('Late projects',late.length,late.length?'worst: '+lp.late+' days':'none late',{go:1,alert:late.length>2})}${kpi('Low stock items',low.length,'below the minimum',{go:4,alert:low.length>4})}</div>
<div class="card" style="grid-row:2/4"><h3>Sales and margin by month <em>bars: sales · line: gross margin</em></h3>${cols(rev,mg,ix.map(i=>MONTHS[i]),usd,pct)}</div>
<div class="card"><h3>Sales by product line <em>click to filter</em></h3>${bars(byLine,{a:'line',lw:96})}</div>
